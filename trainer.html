<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Tinder-тренажёр английского языка для Дениса в дизайн-системе GamePass." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>English Quiz — GamePass</title>
  <link rel="stylesheet" href="translator.css?v=5" />
  <link rel="stylesheet" href="trainer.css?v=5" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <div id="app">
    <!-- Шапка -->
    <header class="head">
      <div class="head-top">
        <a href="index.html" class="exit-bar">‹ План</a>
        <div class="pill-row">
          <div class="pill is-hot" id="streak-pill" title="Серия верных ответов">
            <span class="pill-num" id="streak-num">0</span>
            <span>🔥</span>
          </div>
          <div class="pill counter-pill" id="counter-pill" title="Текущая карточка">
            <span id="counter-num">1 / 124</span>
          </div>
          <button class="pill icon-pill" id="open-stats-btn" title="Аналитика">📊</button>
        </div>
      </div>
    </header>

    <!-- Горизонтальная лента тем (Chitopus sets-strip) -->
    <nav class="sets-strip" id="topic-filters" aria-label="Темы">
      <button class="set-chip is-current" data-topic="all">Все</button>
      <button class="set-chip is-danger" data-topic="errors">🔥 Ошибки</button>
      <button class="set-chip" data-topic="unseen">🆕 Новые</button>
      <button class="set-chip" data-topic="mastered">⭐ Освоено</button>
      <button class="set-chip" data-topic="this-that">This / That</button>
      <button class="set-chip" data-topic="to-be">am / is / are</button>
      <button class="set-chip" data-topic="do-does">do / does</button>
      <button class="set-chip" data-topic="verbs-s">-s у глаголов</button>
      <button class="set-chip" data-topic="articles-plurals">Артикли / Мн. ч.</button>
      <button class="set-chip" data-topic="past-tense">was / were / did</button>
      <button class="set-chip" data-topic="eliza-rules">Правила Элизы</button>
      <button class="set-chip" data-topic="speaking">Бытовая речь</button>
    </nav>

    <!-- Линия прогресса -->
    <div class="progress-line">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Главная рабочая сцена квиза (Zero-Scroll Stage) -->
    <main class="quiz-stage" id="quiz-stage">
      <!-- Наполняется из engine.js -->
    </main>
  </div>

  <!-- Нижний лист со статистикой (Chitopus .sheet) -->
  <div class="sheet-backdrop" id="stats-sheet" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <h2 class="sheet-title">Дневник тренировки</h2>
      <p class="sheet-sub">Статистика ответов и интервального повторения</p>

      <div class="stat-strip">
        <div class="stat-card">
          <div class="stat-label">Всего ответов</div>
          <div class="stat-value" id="stat-total-reviews">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Точность</div>
          <div class="stat-value" id="stat-accuracy" style="color:var(--accent-1)">0%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Освоено</div>
          <div class="stat-value" id="stat-mastered" style="color:var(--color-success)">0 / 124</div>
        </div>
      </div>

      <div style="font-size:12px;line-height:1.4;color:var(--accent-1);background:var(--accent-soft);border:1px solid rgba(255,179,64,0.2);padding:9px 12px;border-radius:10px;margin-bottom:18px">
        💾 Все ответы сохраняются в памяти браузера навсегда. Даже если закрыть вкладку, твой прогресс и освоенные карточки никуда не пропадут.
      </div>

      <div style="margin-bottom: 24px">
        <div class="stat-label" style="margin-bottom: 10px">Результаты по темам:</div>
        <div id="topics-accuracy-list"></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <button class="btn btn-primary" id="export-ai-btn">
          📋 Скопировать отчёт для Claude / Gemini
        </button>

        <button class="btn btn-ghost is-danger" id="reset-btn">
          Сбросить историю ответов
        </button>
      </div>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="translator.js?v=5"></script>
  <script src="cards-data.js?v=5"></script>
  <script src="engine.js?v=5"></script>
</body>
</html>
